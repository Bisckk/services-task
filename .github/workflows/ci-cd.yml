name: CI/CD tasks-service

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 1. Compilar y ejecutar pruebas unitarias
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test

  # 2. Construir y publicar la imagen Docker (solo en main)
  docker:
    needs: build-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      has-kubeconfig: ${{ steps.kubeconfig.outputs.present }}
    steps:
      - uses: actions/checkout@v4

      # GHCR exige nombres de imagen en minúsculas
      - name: Nombre de imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-service" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      # Los secretos no se pueden leer en el "if" de un job; se expone aquí
      - name: Comprobar secreto KUBECONFIG
        id: kubeconfig
        run: echo "present=${{ secrets.KUBECONFIG != '' }}" >> "$GITHUB_OUTPUT"

  # 3. Desplegar automáticamente en el clúster
  # (se omite si el repositorio no tiene el secreto KUBECONFIG)
  deploy:
    needs: docker
    if: needs.docker.outputs.has-kubeconfig == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # GHCR exige nombres de imagen en minúsculas
      - name: Nombre de imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tasks-service" >> "$GITHUB_ENV"

      - name: Configurar kubectl
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Aplicar manifiestos
        run: kubectl apply -f k8s/

      - name: Actualizar imagen
        run: |
          kubectl set image deployment/tasks-service \
            tasks-service=${{ env.IMAGE }}:${{ github.sha }}
          kubectl rollout status deployment/tasks-service --timeout=120s
